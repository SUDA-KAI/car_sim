# Ideal upper-hemisphere sampling; NOT an emulation of Unitree's scan pattern.
# All point times are zero: Gazebo takes one instantaneous snapshot per frame.
lidar:
  rate_hz: 10.0
  horizontal_samples: 360
  vertical_samples: 19
  elevation_min_deg: 0.0
  elevation_max_deg: 89.0
  range_min_m: 0.1
  range_max_m: 30.0
  range_noise_stddev_m: 0.0
imu:
  rate_hz: 200.0
  acceleration_noise_stddev: 0.0
  angular_velocity_noise_stddev: 0.0
scan:
  # Near-horizontal height window in the L2 frame, not a ground-removal algorithm.
  min_height_m: -0.03
  max_height_m: 0.12
  bins: 360
