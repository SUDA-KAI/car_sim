# Acquisition-time aligned D6 wall/corner + L2 endpoints; wheel/WIT odometry.
amcl:
  ros__parameters:
    use_sim_time: false
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /localization/multi_lidar_scan
    map_topic: /map
    robot_model_type: nav2_amcl::DifferentialMotionModel
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.15
    alpha4: 0.1
    alpha5: 0.1
    min_particles: 500
    max_particles: 2000
    max_beams: 360
    pf_err: 0.03
    pf_z: 0.99
    update_min_d: 0.03
    update_min_a: 0.03
    resample_interval: 1
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_min_range: 0.35
    laser_max_range: 6.0
    sigma_hit: 0.2
    z_hit: 0.8
    z_rand: 0.2
    do_beamskip: false
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    transform_tolerance: 0.2
    tf_broadcast: true
    set_initial_pose: false
    always_reset_initial_pose: true
    recovery_alpha_slow: 0.0
    recovery_alpha_fast: 0.0
    save_pose_rate: -1.0
