# Humble MPPI: a sampling-based MPC variant for the existing Ackermann chassis.
# Launch derives speed, turning radius and footprint from the selected scene.
plugin: nav2_mppi_controller::MPPIController
motion_model: Ackermann
model_dt: 0.1
time_steps: 35
batch_size: 800
iteration_count: 1
vx_std: 0.18
vy_std: 0.0
wz_std: 0.25
vx_max: 0.18
vx_min: -0.10
vy_max: 0.0
wz_max: 0.15
temperature: 0.3
gamma: 0.015
visualize: false
regenerate_noises: false
retry_attempt_limit: 2
transform_tolerance: 0.3
prune_distance: 2.0
enforce_path_inversion: true
inversion_xy_tolerance: 0.10
inversion_yaw_tolerance: 0.15
AckermannConstraints:
  min_turning_r: 2.0
critics: [ConstraintCritic, ObstaclesCritic, GoalCritic, GoalAngleCritic,
          PathAlignCritic, PathFollowCritic, PathAngleCritic]
ConstraintCritic:
  enabled: true
  cost_power: 1
  cost_weight: 4.0
GoalCritic:
  enabled: true
  cost_power: 1
  cost_weight: 5.0
  threshold_to_consider: 1.4
GoalAngleCritic:
  enabled: true
  cost_power: 1
  cost_weight: 3.0
  threshold_to_consider: 0.5
PathAlignCritic:
  enabled: true
  cost_power: 1
  cost_weight: 10.0
  max_path_occupancy_ratio: 0.08
  trajectory_point_step: 3
  threshold_to_consider: 0.5
  offset_from_furthest: 12
  use_path_orientations: true
PathFollowCritic:
  enabled: true
  cost_power: 1
  cost_weight: 6.0
  offset_from_furthest: 5
  threshold_to_consider: 1.4
PathAngleCritic:
  enabled: true
  cost_power: 1
  cost_weight: 2.0
  offset_from_furthest: 4
  threshold_to_consider: 0.5
  max_angle_to_furthest: 1.0
  # This Humble build uses forward_preference rather than the newer 'mode'.
  forward_preference: false
ObstaclesCritic:
  enabled: true
  cost_power: 1
  repulsion_weight: 0.0
  critical_weight: 20.0
  consider_footprint: true
  collision_cost: 10000.0
  collision_margin_distance: 0.0
  near_goal_distance: 1.0
