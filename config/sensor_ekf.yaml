ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 20.0
    sensor_timeout: 0.6
    two_d_mode: true
    publish_tf: true
    publish_acceleration: false
    print_diagnostics: true
    predict_to_current_time: true
    smooth_lagged_data: true
    history_length: 2.0
    transform_time_offset: 0.0
    transform_timeout: 0.1
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # Planar scan/gyro odometry starts at its own estimated origin; never truth.
    odom0: /localization/lidar_odom
    odom0_config: [true, true, false, false, false, false, false, false, false, false, false, false, false, false, false]
    odom0_queue_size: 20
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false
    odom0_pose_rejection_threshold: 3.0
    # Independent visual *velocities*. Do not double-fuse accumulated VO poses.
    odom1: /localization/visual_odom
    odom1_config: [false, false, false, false, false, false, true, true, false, false, false, true, false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
    odom1_twist_rejection_threshold: 4.0
    # The separately mounted IMU contributes gyro only. No perfect Gazebo attitude.
    imu0: /imu/data_raw
    imu0_config: [false, false, false, false, false, false, false, false, false, false, false, true, false, false, false]
    imu0_queue_size: 50
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
