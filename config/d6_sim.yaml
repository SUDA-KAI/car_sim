# Mirrors navigation.launch.py and the commissioned two-D6 topic assignment.
# Yaw comes from the current directional-cardboard calibration; remeasure for
# safety work. A transparent/reflective surface is not modelled by Gazebo here.
rate_hz: 10.0
bins: 720
min_range_m: 0.05
max_range_m: 12.0
range_noise_stddev_m: 0.0
sensors:
  b: {frame: d6_b_link, x: 0.410, y: 0.0, z: 0.320, yaw: 0.0733038286}
  a: {frame: d6_a_link, x: -0.600, y: 0.0, z: 0.320, yaw: -3.129375347}
