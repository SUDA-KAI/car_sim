map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ''
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: false
      analytic_expansion_max_length: 5.0
      analytic_expansion_ratio: 3.5
      angle_quantization_bins: 72
      cache_obstacle_heuristic: true
      change_penalty: 0.0
      cost_penalty: 6.0
      debug_visualizations: false
      downsample_costmap: false
      downsampling_factor: 1
      lookup_table_size: 10.0
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      minimum_turning_radius: 2.0
      motion_model_for_search: REEDS_SHEPP
      non_straight_penalty: 1.5
      plugin: nav2_smac_planner/SmacPlannerHybrid
      retrospective_penalty: 0.015
      reverse_penalty: 1.0
      smooth_path: true
      smoother:
        do_refinement: true
        max_iterations: 1000
        tolerance: 1.0e-10
        w_data: 0.5
        w_smooth: 0.4
      tolerance: 0.2
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    use_sim_time: true
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.01
    feedback: OPEN_LOOP
    max_accel:
    - 0.15
    - 0.0
    - 0.35
    max_decel:
    - -0.2
    - 0.0
    - -0.35
    max_velocity:
    - 0.3
    - 0.0
    - 0.15
    min_velocity:
    - -0.12
    - 0.0
    - -0.15
    odom_duration: 0.15
    odom_topic: /chassis/odom
    scale_velocities: true
    smoothing_frequency: 20.0
    use_sim_time: true
    velocity_timeout: 0.5
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: true
    wait_at_waypoint:
      enabled: true
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 200
    waypoint_task_executor_plugin: wait_at_waypoint
