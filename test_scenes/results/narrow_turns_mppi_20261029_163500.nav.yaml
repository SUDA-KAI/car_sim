amcl:
  ros__parameters:
    base_frame_id: base_link
    global_frame_id: map
    initial_pose:
      x: -2.0
      y: -3.0
      yaw: 0.0
      z: 0.0
    laser_max_range: 25.0
    laser_min_range: 0.15
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    robot_model_type: nav2_amcl::DifferentialMotionModel
    scan_topic: scan
    set_initial_pose: true
    transform_tolerance: 1.0
    use_sim_time: true
behavior_server:
  ros__parameters:
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    backup:
      acceleration_limit: 0.15
      deceleration_limit: -0.15
      minimum_speed: 0.03
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    drive_on_heading:
      acceleration_limit: 0.15
      deceleration_limit: -0.15
      minimum_speed: 0.03
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 50
    default_nav_through_poses_bt_xml: /home/a/ros2_ws/gz_sim/config/navigate_through_poses_ackermann.xml
    default_nav_to_pose_bt_xml: /home/a/ros2_ws/gz_sim/config/navigate_to_pose_ackermann.xml
    default_server_timeout: 2000
    global_frame: map
    odom_topic: /chassis/odom
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
    robot_base_frame: base_link
    use_sim_time: true
controller_server:
  ros__parameters:
    FollowPath:
      AckermannConstraints:
        min_turning_r: 2.0
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.0
        critical_cost: 300.0
        enabled: true
        near_goal_distance: 0.5
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.0
      PathAlignCritic:
        cost_power: 1
        cost_weight: 20.0
        enabled: true
        max_path_occupancy_ratio: 0.05
        offset_from_furthest: 15
        threshold_to_consider: 0.3
        trajectory_point_step: 4
        use_path_orientations: true
      PathAngleCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
        forward_preference: true
        max_angle_to_furthest: 0.6
        offset_from_furthest: 15
        threshold_to_consider: 0.3
      PathFollowCritic:
        cost_power: 1
        cost_weight: 6.0
        enabled: true
        offset_from_furthest: 5
        threshold_to_consider: 1.0
      batch_size: 512
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      enforce_path_inversion: true
      gamma: 0.015
      inversion_xy_tolerance: 0.15
      inversion_yaw_tolerance: 0.2
      iteration_count: 1
      model_dt: 0.1
      motion_model: Ackermann
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 2.0
      regenerate_noises: false
      retry_attempt_limit: 1
      temperature: 0.15
      time_steps: 60
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.18
      vx_min: -0.12
      vx_std: 0.1
      vy_max: 0.0
      vy_std: 0.0
      wz_max: 0.15
      wz_std: 0.1
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    current_goal_checker: general_goal_checker
    failure_tolerance: 4.0
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.12
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    odom_topic: /chassis/odom
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
    progress_checker_plugin: progress_checker
    use_sim_time: true
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[[0.6, 0.5729121954483579], [0.6, -0.5729121954483579], [-0.6, -0.5729121954483579],
        [-0.6, 0.5729121954483579]]'
      footprint_padding: 0.03
      global_frame: map
      inflation_layer:
        cost_scaling_factor: 1.5
        inflation_radius: 0.85
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - static_layer
      - inflation_layer
      publish_frequency: 1.0
      resolution: 0.02
      robot_base_frame: base_link
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      track_unknown_space: true
      update_frequency: 1.0
      use_sim_time: true
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: false
      footprint: '[[0.6, 0.5729121954483579], [0.6, -0.5729121954483579], [-0.6, -0.5729121954483579],
        [-0.6, 0.5729121954483579]]'
      footprint_padding: 0.03
      global_frame: odom
      height: 6
      inflation_layer:
        cost_scaling_factor: 2.5
        inflation_radius: 0.7
        plugin: nav2_costmap_2d::InflationLayer
      plugins:
      - static_layer
      - ultrasonic_layer
      - inflation_layer
      publish_frequency: 3.0
      resolution: 0.02
      robot_base_frame: base_link
      rolling_window: true
      static_layer:
        map_subscribe_transient_local: true
        plugin: nav2_costmap_2d::StaticLayer
      ultrasonic_layer:
