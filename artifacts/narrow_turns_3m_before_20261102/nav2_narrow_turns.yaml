bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /chassis/odom
    bt_loop_duration: 50
    default_server_timeout: 2000
    default_nav_to_pose_bt_xml: /home/a/ros2_ws/gz_sim/config/navigate_to_pose_ackermann.xml
    default_nav_through_poses_bt_xml: /home/a/ros2_ws/gz_sim/config/navigate_through_poses_ackermann.xml
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
    - nav2_compute_path_through_poses_action_bt_node
    - nav2_smooth_path_action_bt_node
    - nav2_follow_path_action_bt_node
    - nav2_wait_action_bt_node
    - nav2_assisted_teleop_action_bt_node
    - nav2_back_up_action_bt_node
    - nav2_drive_on_heading_bt_node
    - nav2_clear_costmap_service_bt_node
    - nav2_is_stuck_condition_bt_node
    - nav2_goal_reached_condition_bt_node
    - nav2_goal_updated_condition_bt_node
    - nav2_globally_updated_goal_condition_bt_node
    - nav2_is_path_valid_condition_bt_node
    - nav2_initial_pose_received_condition_bt_node
    - nav2_reinitialize_global_localization_service_bt_node
    - nav2_rate_controller_bt_node
    - nav2_distance_controller_bt_node
    - nav2_speed_controller_bt_node
    - nav2_truncate_path_action_bt_node
    - nav2_truncate_path_local_action_bt_node
    - nav2_goal_updater_node_bt_node
    - nav2_recovery_node_bt_node
    - nav2_pipeline_sequence_bt_node
    - nav2_round_robin_node_bt_node
    - nav2_transform_available_condition_bt_node
    - nav2_time_expired_condition_bt_node
    - nav2_path_expiring_timer_condition
    - nav2_distance_traveled_condition_bt_node
    - nav2_single_trigger_bt_node
    - nav2_goal_updated_controller_bt_node
    - nav2_is_battery_low_condition_bt_node
    - nav2_navigate_through_poses_action_bt_node
    - nav2_navigate_to_pose_action_bt_node
    - nav2_remove_passed_goals_action_bt_node
    - nav2_planner_selector_bt_node
    - nav2_controller_selector_bt_node
    - nav2_goal_checker_selector_bt_node
    - nav2_controller_cancel_bt_node
    - nav2_path_longer_on_approach_bt_node
    - nav2_wait_cancel_bt_node
    - nav2_back_up_cancel_bt_node
    - nav2_assisted_teleop_cancel_bt_node
    - nav2_drive_on_heading_cancel_bt_node
    - nav2_is_battery_charging_condition_bt_node
    use_sim_time: true
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: true
    feedback: OPEN_LOOP
    max_velocity:
    - 0.18
    - 0.0
    - 0.15
    min_velocity:
    - -0.12
    - 0.0
    - -0.15
    max_accel:
    - 0.15
    - 0.0
    - 0.35
    max_decel:
    - -0.2
    - 0.0
    - -0.35
    odom_topic: /chassis/odom
    odom_duration: 0.15
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.01
    velocity_timeout: 0.5
    use_sim_time: true
controller_server:
  ros__parameters:
    use_sim_time: true
    odom_topic: /chassis/odom
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.003
    failure_tolerance: 4.0
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    current_goal_checker: general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.1
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.2
      yaw_goal_tolerance: 0.12
    FollowPath:
      plugin: teb_local_planner::TebLocalPlannerROS
      odom_topic: /chassis/odom
      teb_autosize: 1.0
      dt_ref: 0.3
      dt_hysteresis: 0.1
      min_samples: 5
      max_samples: 100
      global_plan_overwrite_orientation: false
      allow_init_with_backwards_motion: true
      global_plan_viapoint_sep: 0.3
      via_points_ordered: true
      max_global_plan_lookahead_dist: 3.5
      global_plan_prune_distance: 0.5
      exact_arc_length: true
      feasibility_check_no_poses: -1
      feasibility_check_lookahead_distance: 1.6
      min_resolution_collision_check_angular: 0.15
      control_look_ahead_poses: 1
      publish_feedback: false
      max_vel_x: 0.18
      max_vel_x_backwards: 0.12
      max_vel_y: 0.0
      max_vel_theta: 0.15
      acc_lim_x: 0.15
      acc_lim_y: 0.0
      acc_lim_theta: 0.35
      min_turning_radius: 2.0
      cmd_angle_instead_rotvel: false
      is_footprint_dynamic: false
      footprint_model:
        type: polygon
        vertices: '[[0.6, 0.45], [0.6, -0.45], [-0.6, -0.45], [-0.6, 0.45]]'
      free_goal_vel: false
      min_obstacle_dist: 0.18
      inflation_dist: 0.45
      dynamic_obstacle_inflation_dist: 0.45
      include_costmap_obstacles: true
      include_dynamic_obstacles: false
      costmap_obstacles_behind_robot_dist: 2.5
      obstacle_poses_affected: 15
      legacy_obstacle_association: false
      obstacle_association_force_inclusion_factor: 2.0
      obstacle_association_cutoff_factor: 8.0
      no_inner_iterations: 5
      no_outer_iterations: 4
      optimization_activate: true
      optimization_verbose: false
      penalty_epsilon: 0.01
      obstacle_cost_exponent: 2.0
      weight_max_vel_x: 5.0
      weight_max_vel_y: 0.0
      weight_max_vel_theta: 5.0
      weight_acc_lim_x: 20.0
      weight_acc_lim_y: 0.0
      weight_acc_lim_theta: 20.0
      weight_kinematics_nh: 1000.0
      weight_kinematics_forward_drive: 1.0
      weight_kinematics_turning_radius: 100.0
      weight_optimaltime: 1.0
      weight_shortest_path: 0.0
      weight_obstacle: 100.0
      weight_inflation: 2.0
      weight_dynamic_obstacle: 2.0
      weight_dynamic_obstacle_inflation: 2.0
      weight_viapoint: 20.0
      weight_adapt_factor: 2.0
      enable_homotopy_class_planning: false
      enable_multithreading: false
      shrink_horizon_backup: true
      shrink_horizon_min_duration: 2.0
      oscillation_recovery: true
      oscillation_v_eps: 0.05
      oscillation_omega_eps: 0.05
      oscillation_recovery_min_duration: 3.0
      oscillation_filter_duration: 3.0
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 3.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.02
      footprint: '[[0.6, 0.45], [0.6, -0.45], [-0.6, -0.45], [-0.6, 0.45]]'
      footprint_padding: 0.03
      plugins:
      - static_layer
      - inflation_layer
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 0.7
      always_send_full_costmap: false
      use_sim_time: true
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      footprint: '[[0.6, 0.45], [0.6, -0.45], [-0.6, -0.45], [-0.6, 0.45]]'
      footprint_padding: 0.03
      resolution: 0.02
      track_unknown_space: true
      plugins:
      - static_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.5
        inflation_radius: 0.85
      always_send_full_costmap: false
      use_sim_time: true
map_server:
  ros__parameters:
    yaml_filename: ''
    use_sim_time: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.2
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: REEDS_SHEPP
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.0
      minimum_turning_radius: 2.0
      reverse_penalty: 1.0
      change_penalty: 0.0
      non_straight_penalty: 1.5
      cost_penalty: 6.0
      retrospective_penalty: 0.015
      lookup_table_size: 10.0
      cache_obstacle_heuristic: true
      debug_visualizations: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.4
        w_data: 0.5
        tolerance: 1.0e-10
        do_refinement: true
    use_sim_time: true
smoother_server:
  ros__parameters:
    smoother_plugins:
    - simple_smoother
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true
    use_sim_time: true
behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    behavior_plugins:
    - backup
    - drive_on_heading
    - assisted_teleop
    - wait
    backup:
      plugin: nav2_behaviors/BackUp
      acceleration_limit: 0.15
      deceleration_limit: -0.15
      minimum_speed: 0.03
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
      acceleration_limit: 0.15
      deceleration_limit: -0.15
      minimum_speed: 0.03
    wait:
      plugin: nav2_behaviors/Wait
    assisted_teleop:
      plugin: nav2_behaviors/AssistedTeleop
    use_sim_time: true
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
    use_sim_time: true
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_link
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: scan
    robot_model_type: nav2_amcl::DifferentialMotionModel
    min_particles: 500
    max_particles: 2000
    laser_max_range: 25.0
    laser_min_range: 0.15
    transform_tolerance: 1.0
    set_initial_pose: true
    initial_pose:
      x: -5.0
      y: -5.0
      z: 0.0
      yaw: 0.0
